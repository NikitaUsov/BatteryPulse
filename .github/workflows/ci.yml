name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux · core tests
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    # A hung test would otherwise hold the runner for GitHub's 6-hour default; a run takes 3-5
    # minutes.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Check the manifest
        # Fails early, with the manifest's own error, if Package.swift doesn't evaluate.
        run: swift package dump-package > /dev/null
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests Package.swift
      - name: Build
        # The warning gate: every compiler warning fails the job, except a deprecation, which stays a
        # warning (a kept deprecated API is marked with @diagnose). Release builds don't get it, so a
        # newer Xcode can't fail the release of a commit that passed here.
        run: >-
          swift build --build-tests
          -Xswiftc -warnings-as-errors -Xswiftc -Wwarning -Xswiftc DeprecatedDeclaration
      - name: Test
        run: swift test --skip-build

  macos:
    name: macOS · build & test
    # macOS 27 + Xcode 27 image (preview label): the package targets macOS 27, so its tests
    # can't run on older hosts.
    runs-on: xcode-27
    # The same for a hung test or smoke run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: Test
        # The warning gate, as in the Linux job.
        run: swift test -Xswiftc -warnings-as-errors -Xswiftc -Wwarning -Xswiftc DeprecatedDeclaration
      - name: Build bpulse (release)
        run: swift build -c release --product bpulse
      - name: Smoke-run bpulse
        # Hosted runners are VMs without a battery, so exit status 2 ("no battery") is expected.
        run: |
          set +e
          .build/release/bpulse
          status=$?
          battery_status=$status
          echo "bpulse exited with $status"
          [ "$status" -eq 0 ] || [ "$status" -eq 2 ] || exit 1
          # The SMC listing must not crash, with or without an SMC in the VM.
          .build/release/bpulse --smc > smc.txt
          status=$?
          head -20 smc.txt
          echo "bpulse --smc exited with $status ($(wc -l < smc.txt) lines)"
          [ "$status" -eq 0 ] || [ "$status" -eq 2 ] || exit 1
          # Loading MobileDevice and watching for devices must not crash or hang; the VM has no
          # iPhone, so 2 ("no device") is expected.
          .build/release/bpulse --devices
          status=$?
          echo "bpulse --devices exited with $status"
          # --record takes no output format: usage error.
          .build/release/bpulse --record "$RUNNER_TEMP/rec" --json; [ $? -eq 1 ] || exit 1
          # Without a battery it ends with 2 and creates nothing. (With one it would record until
          # interrupted, so it only runs where plain bpulse found no battery: AppleSmartBattery
          # and IOPS both count.)
          if [ "$battery_status" -eq 2 ]; then
            .build/release/bpulse --record "$RUNNER_TEMP/rec"; [ $? -eq 2 ] && [ ! -e "$RUNNER_TEMP/rec" ] || exit 1
          fi
          [ "$status" -eq 0 ] || [ "$status" -eq 2 ]
      - name: Check the verification scripts
        # Neither script is built or run anywhere else; they need a Mac with a display.
        run: bash -n scripts/menu-bar-shots.sh && swiftc -typecheck scripts/display-metrics.swift
      - name: Build BatteryKit for iOS
        run: xcodebuild build -scheme BatteryKit -destination 'generic/platform=iOS' -quiet
      - name: Package app (DMG)
        run: BUILD_NUMBER=${{ github.run_number }} scripts/build-app.sh
      - name: Smoke-test update signing
        # The release signs with a secret this job doesn't get, so sign with a throwaway key:
        # the signature must verify, and a changed DMG must not.
        run: |
          UPDATE_SIGNING_KEY="$(swift scripts/sign-update.swift --generate-key)"
          export UPDATE_SIGNING_KEY
          public_key="$(swift scripts/sign-update.swift --public-key)"
          swift scripts/sign-update.swift build/BatteryPulse.dmg
          swift scripts/sign-update.swift --verify build/BatteryPulse.dmg "$public_key"
          cp build/BatteryPulse.dmg build/tampered.dmg
          cp build/BatteryPulse.dmg.sig build/tampered.dmg.sig
          printf 'x' >> build/tampered.dmg
          if swift scripts/sign-update.swift --verify build/tampered.dmg "$public_key"; then
            echo "error: a changed DMG passed verification" >&2
            exit 1
          fi
          rm build/tampered.dmg build/tampered.dmg.sig build/BatteryPulse.dmg.sig
      - name: Upload DMG
        # Pinned to the commit of the v6.0.0 tag: v4 and v5 run on the deprecated Node.js 20.
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: BatteryPulse-${{ github.sha }}
          path: build/BatteryPulse.dmg
          if-no-files-found: error
