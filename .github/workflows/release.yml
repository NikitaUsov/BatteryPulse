name: Release

# Publishes BatteryPulse.dmg on the Releases page, either by pushing a tag such as v0.2.0 or
# by running this workflow from the Actions tab with a version number.
#
# The job runs in the `release` environment, which holds the UPDATE_SIGNING_KEY secret. Give that
# environment a required reviewer (Settings > Environments > release) and keep the key out of
# the repository secrets: anyone who can push a commit and a tag could otherwise get their own
# build signed, and the app would install it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v (for example 0.2.0)
        required: true

# contents: write is for gh release create, the only write. Actions are pinned to the full commit
# SHA of the tag named in their comment, and expressions reach shell scripts only through env:.
permissions:
  contents: write

jobs:
  release:
    name: Build and publish DMG
    runs-on: xcode-27
    environment: release
    env:
      # The image's default is Xcode 27.1 (27A9275); 27.2 is installed beside it, for now as
      # Apple's release candidate (27B48), which Xcode_27.2.app names until the image carries the
      # release. Use the newest release or its release candidate, never a beta.
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    # A hung step would otherwise hold the runner for GitHub's 6-hour default.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gh gets the token through GH_TOKEN, so it isn't left in .git/config for the build.
          persist-credentials: false
      - name: Check the release notes
        # The notes become the release's text, which the Software Update window shows to everyone
        # updating, so they must open with this version's heading: "## What's new in 0.6.1", or
        # "## What's new in 0.6" for 0.6.0. The script reads only VERSION and NOTES, so it can run
        # by hand on a draft before the tag: set the two variables and run its lines.
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          NOTES: .github/release-notes.md
        run: |
          version="${VERSION#v}"
          heading="## What's new in $version"
          short="## What's new in ${version%.0}"
          expected="\"$short\""
          [ "$short" = "$heading" ] || expected="\"$short\" or \"$heading\""
          if [ ! -s "$NOTES" ]; then
            echo "::error file=$NOTES::$NOTES is missing or empty; the notes of $version open with $expected."
            exit 1
          fi
          first="$(head -n 1 "$NOTES" | tr -d '\r')"
          if [ "$first" != "$heading" ] && [ "$first" != "$short" ]; then
            echo "::error file=$NOTES,line=1::$NOTES opens with \"$first\"; the notes of $version open with $expected."
            exit 1
          fi
          echo "$NOTES opens with \"$first\""
      - name: Check the version count's file
        # .github/BatteryPulse-count.txt is the anonymous version count's asset: every release from
        # 0.7.0 attaches it, and a Mac counts its version by downloading it from that version's
        # release. It must never be removed from a published release: the app takes the 404 for a
        # release without a counter and never counts that version.
        env:
          COUNT_FILE: .github/BatteryPulse-count.txt
        run: |
          if [ ! -f "$COUNT_FILE" ]; then
            echo "::error file=$COUNT_FILE::$COUNT_FILE is missing; every release attaches it for the anonymous version count."
            exit 1
          fi
          size="$(wc -c <"$COUNT_FILE" | tr -d ' ')"
          if [ "$size" -lt 1 ] || [ "$size" -gt 1024 ]; then
            echo "::error file=$COUNT_FILE::$COUNT_FILE holds $size bytes; the version count's file holds 1 to 1024."
            exit 1
          fi
          echo "$COUNT_FILE holds $size bytes"
      - name: Check the update signing key
        # The app installs an update itself only if the DMG is signed with the private half of
        # one of ReleaseSigning.publicKeys, so stop before building when the secret is missing or
        # belongs to a key the app doesn't list.
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::error::The UPDATE_SIGNING_KEY secret is missing or empty. Add it to the release environment in Settings > Environments (see scripts/sign-update.swift)."
            exit 1
          fi
          # One quoted base64 key (44 characters) per line of the publicKeys array. A line that is
          # only a comment doesn't count: the app doesn't trust a key commented out of the list.
          expected="$(sed -n '/static let publicKeys = \[/,/^ *\]/p' Sources/BatteryCore/ReleaseSigning.swift \
            | grep -v '^[[:space:]]*//' | grep -oE '"[A-Za-z0-9+/]{43}="' | tr -d '"' || true)"
          if [ -z "$expected" ]; then
            echo "::error::Can't read ReleaseSigning.publicKeys from Sources/BatteryCore/ReleaseSigning.swift."
            exit 1
          fi
          actual="$(swift scripts/sign-update.swift --public-key)"
          if ! grep -qxF -- "$actual" <<<"$expected"; then
            echo "::error::UPDATE_SIGNING_KEY belongs to the public key $actual, but the app trusts only $(paste -sd ' ' - <<<"$expected") (ReleaseSigning.publicKeys)."
            exit 1
          fi
          echo "UPDATE_PUBLIC_KEY=$actual" >> "$GITHUB_ENV"
      - name: Test
        run: swift test
      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: '$version' is not a version like 0.2.0" >&2
            exit 1
          fi
          # A manual run must not attach a DMG built from this commit to an existing release.
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]] && gh release view "v$version" >/dev/null 2>&1; then
            echo "error: release v$version already exists" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Package app (DMG)
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: scripts/build-app.sh
      - name: Refuse a profiling build
        # PROFILING=1 signs the app with get-task-allow (scripts/build-app.sh); such a build is
        # never published.
        run: |
          if [ -e build/BatteryPulse-profiling.app ] || [ -e build/BatteryPulse-profiling.dmg ]; then
            echo "::error::build/ holds a profiling build (PROFILING=1), which is never published."
            exit 1
          fi
          for bundle in build/BatteryPulse.app build/BatteryPulse.app/Contents/PlugIns/BatteryPulseWidget.appex; do
            entitlements="$(codesign -d --entitlements - "$bundle" 2>/dev/null || true)"
            if grep -F get-task-allow <<<"$entitlements" >/dev/null; then
              echo "::error::$bundle is signed with get-task-allow, like a profiling build; it is never published."
              exit 1
            fi
          done
      - name: Size report
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/size-report.sh
      - name: Upload the size report
        # Pinned to the commit of the v7.0.2 tag; v4 and v5 run on the deprecated Node.js 20.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-${{ github.sha }}
          path: build/size.json
          if-no-files-found: error
      - name: Sign DMG
        # Writes build/BatteryPulse.dmg.sig, which the in-app updater checks before installing.
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          swift scripts/sign-update.swift build/BatteryPulse.dmg
          swift scripts/sign-update.swift --verify build/BatteryPulse.dmg "$UPDATE_PUBLIC_KEY"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # The DMG and its signature keep stable names, so releases/latest/download/BatteryPulse.dmg
        # always works and the app finds BatteryPulse.dmg.sig next to it. BatteryPulse-dSYMs.zip
        # holds the debug information stripped from the shipped binaries, for crash reports.
        # BatteryPulse-count.txt (named after the file) is the version count's asset; never remove
        # it from a published release.
        run: |
          gh release create "v$VERSION" build/BatteryPulse.dmg build/BatteryPulse.dmg.sig build/BatteryPulse-dSYMs.zip .github/BatteryPulse-count.txt \
            --target "$GITHUB_SHA" --title "BatteryPulse $VERSION" \
            --notes-file .github/release-notes.md --generate-notes
      - name: Check the published version count's asset
        # Without the asset no Mac counts this version, and each marks it done on the 404. A Mac
        # counts at the earliest a day after it first ran the version, so there is time to attach it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "v$VERSION" --json assets --jq '.assets[].name' | grep -qxF BatteryPulse-count.txt; then
            echo "::error::Release v$VERSION doesn't list BatteryPulse-count.txt, so no Mac would count it. Attach it before anyone has run v$VERSION for a day: gh release upload \"v$VERSION\" .github/BatteryPulse-count.txt"
            exit 1
          fi
          echo "v$VERSION lists BatteryPulse-count.txt"
