name: Feature request
description: Suggest a new reading, view or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to see?
      description: Describe the reading or feature and why it is useful.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [macOS, iOS]
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links to APIs, IORegistry keys or similar apps are welcome.
