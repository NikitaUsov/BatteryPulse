name: Bug report
description: Wrong or missing battery data, crashes, or other problems
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "MacBook Pro 14\" M3 Pro, 2023 / iPhone 15 Pro"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
      description: BatteryPulse requires macOS 27 on Apple Silicon, or iOS 27.
      placeholder: macOS 27.0 / iOS 27.0
    validations:
      required: true
  - type: textarea
    id: capture
    attributes:
      label: Raw capture (macOS)
      description: |
        In BatteryPulse, turn on Settings → Advanced → Show Developer section, then choose
        Developer → Export Capture… and attach the file (drag it here). From a source checkout,
        `swift run bpulse --raw > capture.xml` does the same. Serial numbers are redacted
        automatically. If the problem is with a specific reading, also paste the report from
        Copy Report in the main window's toolbar, which contains no serial numbers.
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
